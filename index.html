<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunZones · Alvaro</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --seq-200: #9ec5f4;
    --seq-450: #2a78d6;
    --good: #0ca30c;
    --good-text: #006300;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --seq-200: #184f95;
      --seq-450: #3987e5;
      --good: #0ca30c;
      --good-text: #0ca30c;
      --chip-bg: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--text-primary);
    line-height: 1.45;
  }
  header {
    padding: 20px 24px 0; max-width: 1060px; margin: 0 auto;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  header .sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
  nav {
    display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--grid);
    overflow-x: auto;
  }
  nav button {
    flex: 0 0 auto;
    appearance: none; background: none; border: none; cursor: pointer;
    font: inherit; font-size: 14px; color: var(--text-secondary);
    padding: 8px 14px; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav button.active { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }
  main { max-width: 1060px; margin: 0 auto; padding: 20px 24px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .card .k { font-size: 12px; color: var(--text-secondary); }
  .card .v { font-size: 26px; font-weight: 700; margin-top: 2px; letter-spacing: -0.02em; }
  .card .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card .v .unit { font-size: 14px; font-weight: 500; color: var(--text-secondary); }

  .panel {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; margin-bottom: 20px;
  }
  .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .panel .hint { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--grid); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--chip-bg); color: var(--text-secondary); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }

  .sysrow { display: grid; grid-template-columns: 170px 1fr 44px; gap: 12px; align-items: center; padding: 7px 0; }
  .sysrow .name { font-size: 13.5px; }
  .sysrow .why { font-size: 11.5px; color: var(--muted); }
  .sysbar { height: 10px; background: var(--chip-bg); border-radius: 5px; overflow: hidden; }
  .sysbar > div { height: 100%; border-radius: 5px 4px 4px 5px; background: var(--series-1); }
  .sysrow .score { font-size: 13.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

  .weekcard { border: 1px solid var(--grid); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .weekcard.current { border-color: var(--series-1); }
  .weekcard .whead { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 13px; }
  .weekcard .whead b { font-size: 13.5px; }
  .weekcard ul { list-style: none; margin-top: 8px; display: grid; gap: 4px; }
  .weekcard li { font-size: 12.5px; color: var(--text-secondary); padding-left: 14px; position: relative; }
  .weekcard li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--baseline); }
  .weekcard li.key::before { background: var(--series-2); }
  .phase { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

  .hero { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  .hero-sub { color: var(--text-secondary); font-size: 13px; }

  #tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); padding: 8px 11px; font-size: 12.5px;
  }
  #tooltip .t1 { font-weight: 600; }
  #tooltip .t2 { color: var(--text-secondary); }
  svg text { font-family: inherit; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-top: 8px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }

  .calweek { border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .calweek.current { border-color: var(--series-1); }
  .daygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .daycard { border: 1px solid var(--grid); border-radius: 8px; padding: 8px 9px; min-height: 64px; background: var(--page); min-width: 0; overflow: hidden; cursor: pointer; transition: border-color 0.12s; }
  .daycard:hover { border-color: var(--series-1); }
  .daycard *, .weekcard * { overflow-wrap: break-word; }
  .dtitle, .dtag, .dsteps li { overflow-wrap: anywhere; }
  .daycard.today { outline: 2px solid var(--series-1); outline-offset: -1px; }
  .dhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .dnum { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dbadge { font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; color: #fff; border-radius: 4px; padding: 1px 6px; }
  .dtitle { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .dtag { font-weight: 500; color: var(--text-secondary); font-size: 11.5px; }
  .dsteps { list-style: none; margin-top: 6px; display: grid; gap: 3px; }
  .dsteps li { font-size: 11px; color: var(--text-secondary); line-height: 1.35; padding-left: 10px; position: relative; }
  .dsteps li::before { content: ""; position: absolute; left: 0; top: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--baseline); }
  @media (max-width: 1100px) { .daygrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 900px) { .daygrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .compactgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    header, main { padding-left: 12px; padding-right: 12px; }
    .sysrow { grid-template-columns: 96px 1fr 34px; gap: 8px; }
    .sysrow .why { font-size: 10.5px; }
    .daygrid, .compactgrid { grid-template-columns: 1fr; }
    .daycard { min-height: 0; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card .v { font-size: 21px; }
    .panel { padding: 12px; }
    .whead { flex-direction: column; align-items: flex-start; }
    table { display: block; overflow-x: auto; white-space: nowrap; font-size: 12px; }
    #modal { padding: 16px 14px; width: 96vw; max-height: 90vh; }
    nav button { padding: 8px 10px; font-size: 13px; }
  }
  * { min-width: 0; }
  .panel, .card, .tipcard, .weekcard { overflow-wrap: break-word; word-break: normal; }

  /* day detail modal */
  #modalWrap { position: fixed; inset: 0; z-index: 50; display: none; }
  #modalWrap.open { display: block; }
  #modalWrap .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  #modal {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(680px, 94vw); max-height: 86vh; overflow-y: auto;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  #modal h3 { font-size: 17px; margin-bottom: 2px; }
  #modal .msub { color: var(--text-secondary); font-size: 12.5px; margin-bottom: 12px; }
  #modal h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 6px; }
  #modal ul { list-style: none; display: grid; gap: 5px; }
  #modal li { font-size: 13px; color: var(--text-secondary); padding-left: 14px; position: relative; line-height: 1.45; }
  #modal li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--series-1); }
  #modal p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  #modal .quote { border-left: 3px solid var(--series-2); padding: 6px 12px; margin-top: 6px; background: var(--chip-bg); border-radius: 0 8px 8px 0; }
  #modal .quote b { display: block; font-size: 12.5px; color: var(--text-primary); margin-bottom: 2px; }
  #modal .closex { position: sticky; float: right; top: 0; appearance: none; border: none; background: var(--chip-bg); color: var(--text-secondary); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; }

  /* coach tab */
  .tipcard { border: 1px solid var(--grid); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .tipcard h3 { font-size: 14px; margin-bottom: 4px; }
  .tipcard .ins { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .tipcard .app { font-size: 12.5px; margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: var(--chip-bg); color: var(--text-primary); }
  .tipcard .app b { color: var(--good-text); }
  .tipcard .src { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  #ckbanner { border: 1px solid var(--series-2); background: var(--chip-bg); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  #ckbanner b { color: var(--text-primary); }
  #ckbanner .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #ckbanner button { appearance: none; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
  #ckbanner button.primary { background: var(--series-1); color: #fff; border-color: var(--series-1); }
  .topic-h { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>RunZones <span style="color:var(--muted);font-weight:400">· personal</span></h1>
  <div class="sub" id="headSub">Marathon build</div>
  <nav id="nav"></nav>
</header>
<main>
  <section class="tab" id="tab-dashboard"></section>
  <section class="tab" id="tab-calendar"></section>
  <section class="tab" id="tab-fitness"></section>
  <section class="tab" id="tab-sessions"></section>
  <section class="tab" id="tab-plan"></section>
  <section class="tab" id="tab-race"></section>
  <section class="tab" id="tab-coach"></section>
  <section class="tab" id="tab-zones"></section>
</main>
<div id="tooltip"></div>
<div id="modalWrap"><div class="backdrop"></div><div id="modal"></div></div>

<script>
"use strict";
/* ============================================================
   Seed data (embedded so the app also works when opened as a
   local file). When hosted, data/*.json overrides this seed —
   that's what the Strava sync GitHub Action keeps up to date.

const SEED_KNOWLEDGE = {

  "sources": [

    }
  ],
  "tips": [
    {
      "topic": "The Scully fitness model",
      "tags": [
        "general"
      ],
      "source": "zones",
      "title": "Build the pyramid — and earn the peak",
      "insight": "Base = easy running + steady aerobic. Middle = threshold (LT1/LT2). Peak = VO2/aerobic power + race-specific work. You cannot add the peak without the middle: 'you have to earn the peak'. But once you push the peak, everything below it improves with it — threshold gets faster, easy-run HR drops.",
      "apply": "Your plan phases follow this: Base builds the bottom, Build adds threshold, Peak adds VO2 + marathon-specific work. Don't skip ahead to hard intervals in Base."
    },
    {
      "topic": "The Scully fitness model",
      "tags": [
        "general"
      ],
      "source": "zones",
      "title": "The correlation chain: VO2 → aerobic power → LT2 → race pace",
      "insight": "'If your VO2 isn't where it needs to be, your LT2 is not going to get to where it needs to be. There's always a correlation.' Work backwards from the goal: race pace needs LT2 ~10-15s/km faster, which needs aerobic power faster again, which needs VO2 faster again.",
      "apply": "For a 3:30 marathon (4:58/km): LT2 must reach ~4:45-4:50/km, VO2 reps ~4:15-4:25/km. That's the chain your zones are being pulled toward. Today's chain says ~3:45-3:50 — the gap is the training."
    },
    {
      "topic": "Steady aerobic — his weapon",
      "tags": [
        "steady",
        "easy"
      ],
      "source": "zones",
      "title": "Steady aerobic days, not zone-2 dogma",
      "insight": "'Whenever I've raced well, there's been plenty of work at steady aerobic.' 2-3 runs per week, roughly 25-30% of weekly volume, ~30s/km slower than threshold. The mindset is the point: 'I've decided I'm going to work today' — not a jog. Pace is the priority; physiology follows.",
      "apply": "Your Thursday steady run is exactly this. Treat it as a work day: get the sweat going, no stopping, hold the pace."
    },
    {
      "topic": "Steady aerobic — his weapon",
      "tags": [
        "easy"
      ],
      "source": "zones",
      "title": "The luxury run",
      "insight": "Zone 1 easy jogs: 'Doesn't matter what the pace is, doesn't matter what the pulse is. It's a luxury run. I don't think I'm building fitness, I'm spending time running — and a lot of runners could get a lot better by just spending time running.'",
      "apply": "Easy days after hard days: zero pressure. If in doubt, slower. These runs buy you the volume that makes everything else work."
    },
    {
      "topic": "Threshold",
      "tags": [
        "threshold"
      ],
      "source": "zones",
      "title": "Threshold every 3-4 days, and track it weekly",
      "insight": "'Once every 3-4 days make sure you're doing some LT1 or LT2. Build that middle bit of your pyramid, make it beefy.' Formats are simple: 3×15min at the bottom of threshold, 3×10min or 30min straight at the top end. 'Keep threshold where it needs to be. Track that weekly. Don't let it slip.'",
      "apply": "Your Tuesday quality slot rotates through these. The real test of threshold: it should FEEL sustainable for 50-70 minutes. If a 'threshold' rep cooks you, it was too fast."
    },
    {
      "topic": "VO2 / aerobic power",
      "tags": [
        "vo2"
      ],
      "source": "zones",
      "title": "Touch VO2 at least every 10 days or it decays",
      "insight": "'If I leave it two weeks without training above threshold, it feels harder and it's slower.' Vary the stimulus: 5-6×1k, 15×1min, 10×60s uphill, or a 5k time trial. A time trial has a bonus: 'if you're willing to do a 5k time trial, everything else starts to feel easier — no reps can hurt you after that.'",
      "apply": "In Build/Peak phases your VO2 day covers this. Every ~6 weeks, swap it for a 5K time trial — it recalibrates all your zones AND toughens you."
    },
    {

      "source": "lt1",
      "title": "Become a diesel engine",
      "insight": "The body stores only ~100 minutes of threshold-intensity fuel, but your race lasts 3:30+. So the marathon is raced at LT1, not LT2 — and normal training never exposes a weak LT1. 'You don't find out until race day that your LT1 isn't in a great place.'",
      "apply": "This is why your plan has so much easy/steady/long running and why the long run stays controlled. You're building fuel efficiency, not just speed."
    },
    {
      "topic": "Marathon is a fuel race (LT1)",
      "tags": [

      "insight": "On a steady or long run, let HR stabilise over the first 5k (say 140-145). Over the next 15-20k at the SAME pace, drift should be max 8-10 beats. A 15-20 beat drift = LT1 weak. Improvement looks like: same pace, average HR down ~5 beats month over month, and max HR down too.",

    {
      "topic": "Long run rules",
      "tags": [

    {
      "topic": "Race-pace calibration",
      "tags": [
        "race",

      "topic": "Race-pace calibration",

    const start = new Date(thisMonday.getTime() - i * 7 * dayMs);
    const end = new Date(start.getTime() + 7 * dayMs);
    const inWeek = runs().filter(r => { const d = parseISO(r.date); return d >= start && d < end; });
    weeks.push({
      start, label: `${start.getDate()}.${start.getMonth() + 1}.`,
      km: inWeek.reduce((s, r) => s + r.distanceKm, 0),
      time: inWeek.reduce((s, r) => s + r.movingTimeS, 0),
      count: inWeek.length,
      current: i === 0,
    });
  }
  return weeks;
}

function hrZoneOf(hr) {
  if (hr == null) return null;
  for (let i = S.hrZones.length - 1; i >= 0; i--) if (hr >= S.hrZones[i].minHr) return i + 1;
  return 1;
}

/* Riegel race prediction from the best recent long effort */
function racePrediction() {
  const candidates = runs().filter(r => r.distanceKm >= 8);
  if (!candidates.length) return null;
  let best = null;
  for (const r of candidates) {
    const t = r.movingTimeS * Math.pow(S.goal.distanceKm / r.distanceKm, 1.06);
    if (!best || t < best.predictedS) best = { from: r, predictedS: t };
  }
  return best;
}

/* Infer intended session type, then score execution against it */
function classifySession(r) {
  const n = (r.name || "").toLowerCase();
  if (/locker|easy|recovery|regener/.test(n)) return "easy";
  if (/einstufung|test|race|wettkampf|5k|10k/.test(n)) return "test";
  if (/tempo|threshold|schwelle/.test(n)) return "threshold";
  if (/interval|vo2|track/.test(n)) return "interval";
  if (r.distanceKm >= 13) return "long";
  return "aerobic";
}
const SESSION_TARGETS = () => ({
  easy:      { label: "Easy run",       pace: [S.paceZones[1].minSecPerKm, S.paceZones[0].maxSecPerKm], hr: [1, 2] },
  aerobic:   { label: "Aerobic run",    pace: [S.paceZones[1].minSecPerKm - 20, S.paceZones[1].maxSecPerKm], hr: [2, 3] },
  long:      { label: "Long run",       pace: [S.paceZones[1].minSecPerKm - 15, S.paceZones[0].maxSecPerKm], hr: [2, 3] },
  threshold: { label: "Threshold",      pace: [S.paceZones[3].minSecPerKm, S.paceZones[3].maxSecPerKm], hr: [4, 4] },
  interval:  { label: "VO2 intervals",  pace: [S.paceZones[4].minSecPerKm, S.paceZones[4].maxSecPerKm], hr: [4, 5] },
  test:      { label: "Test / race",    pace: [S.paceZones[4].minSecPerKm, S.paceZones[2].maxSecPerKm], hr: [3, 5] },
});
/* Pace that ignores warm-up/cool-down/stops where lap data exists.
   paceSecPerKm from the sync is MOVING pace (traffic lights excluded);
   best20min/bestKm come from intervals.icu laps. */
const sustainedPace = (r) => Math.min(r.paceSecPerKm ?? Infinity, r.best20minSecPerKm ?? Infinity);
const repPace       = (r) => Math.min(sustainedPace(r), r.bestKmSecPerKm ?? Infinity);
function scoreExecution(r) {
  const kind = classifySession(r);
  const t = SESSION_TARGETS()[kind];
  let score = 100; const notes = [];
  const evalPace = (kind === "interval") ? repPace(r) : (kind === "threshold" || kind === "test") ? sustainedPace(r) : r.paceSecPerKm;
  if (evalPace != null && evalPace !== Infinity) {
    const [lo, hi] = t.pace;
    if (evalPace < lo) { const over = lo - evalPace; score -= Math.min(45, over * 0.55); notes.push(`${Math.round(over)}s/km too fast`); }
    else if (evalPace > hi) { const under = evalPace - hi; score -= Math.min(35, under * 0.35); notes.push(`${Math.round(under)}s/km slower than target (best sustained portion)`); }
  }
  const z = hrZoneOf(r.avgHr);
  if (z != null) {
    const [zlo, zhi] = t.hr;
    if (z > zhi) { score -= (z - zhi) * 14; notes.push(`HR drifted to Z${z}`); }
    else if (z < zlo) { score -= (zlo - z) * 8; notes.push(`HR below Z${zlo}`); }
  }
  return { kind, target: t, score: Math.round(clamp(score, 0, 100)), notes };
}

/* ---- the eight physiological systems (RunZones-style profile) ---- */
function fitnessProfile() {
  const rs = runs();
  const now = new Date();
  const last8w = rs.filter(r => now - parseISO(r.date) < 56 * dayMs);
  const last6w = rs.filter(r => now - parseISO(r.date) < 42 * dayMs);
  const weeks = weeklyAgg(8);
  const avgWeeklyKm = weeks.reduce((s, w) => s + w.km, 0) / 8;
  const activeWeeks = weeks.filter(w => w.count > 0).length;

  const longRun = Math.max(0, ...last6w.map(r => r.distanceKm), ...rs.slice(-6).map(r => r.distanceKm));
  const sustained = rs.filter(r => r.distanceKm >= 5 && r.paceSecPerKm);
  const bestSustainedPace = sustained.length ? Math.min(...sustained.map(r => sustainedPace(r))) : null;
  const bestShortPace = rs.filter(r => r.paceSecPerKm).length ? Math.min(...rs.filter(r => r.paceSecPerKm).map(r => r.paceSecPerKm)) : null;

  const easyRuns = rs.filter(r => r.avgHr && r.paceSecPerKm && hrZoneOf(r.avgHr) <= 2);
  let economy = null;
  if (easyRuns.length) {
    const eff = easyRuns.map(r => (1000 / r.paceSecPerKm) * 60 / r.avgHr); // m per min per bpm
    economy = eff.reduce((a, b) => a + b, 0) / eff.length;
  }
  const easyShare = (() => {
    const withHr = last8w.filter(r => r.avgHr);
    if (!withHr.length) return null;
    const easyT = withHr.filter(r => hrZoneOf(r.avgHr) <= 2).reduce((s, r) => s + r.movingTimeS, 0);
    const totT = withHr.reduce((s, r) => s + r.movingTimeS, 0);
    return easyT / totT;
  })();

  const map = (v, lo, hi) => v == null ? 20 : Math.round(clamp((v - lo) / (hi - lo) * 100, 4, 100));
  const mapInv = (v, best, worst) => v == null ? 20 : Math.round(clamp((worst - v) / (worst - best) * 100, 4, 100));

  return [
    { name: "Aerobic base", score: map(avgWeeklyKm, 0, 55), why: `${fmtKm(avgWeeklyKm)} km/week avg (8w) — marathon-ready ≈ 45–55` },
    { name: "Durability", score: map(longRun, 0, 30), why: `Longest recent run ${fmtKm(longRun)} km — build toward 30–32` },
    { name: "Threshold control", score: mapInv(bestSustainedPace, 310, 430), why: bestSustainedPace ? `Best sustained pace ${fmtPace(bestSustainedPace)} vs threshold target ${fmtPace(S.paceZones[3].maxSecPerKm)}` : "No sustained efforts yet" },
    { name: "VO2 capacity", score: mapInv(bestShortPace, 265, 400), why: bestShortPace ? `Fastest pace ${fmtPace(bestShortPace)}` : "No fast efforts yet" },
    { name: "Speed", score: mapInv(bestShortPace, 240, 380), why: "Top-end pace from short efforts" },
    { name: "Running economy", score: map(economy, 0.85, 1.45), why: economy ? `${economy.toFixed(2)} m/min per bpm on easy runs` : "Need easy runs with HR" },
    { name: "Consistency", score: Math.round(clamp(activeWeeks / 8 * 100 * (Math.min(weeks.at(-1).count + weeks.at(-2).count, 6) / 6 * 0.5 + 0.5), 4, 100)), why: `${activeWeeks}/8 recent weeks with running` },
    { name: "Recovery discipline", score: easyShare == null ? 20 : Math.round(clamp(100 - Math.abs(0.8 - easyShare) * 220, 4, 100)), why: easyShare != null ? `${Math.round(easyShare * 100)}% of run time easy (target ≈ 80%)` : "Need HR data" },
  ];
}

/* ---------- The Coach-method plan ----------
   His structure (from "How Long Should Your Marathon Training Plan Be?"):
   Foundation (variable) -> marathon block of 12-16 wks:
   Build ~5wks (tempo in, long run grows, big sessions) ending in a TEST race,
   Specific ~5wks (fix weaknesses, race pace >=10k/wk, ugly-zone days, minimum dose to hold peak),
   Taper 3wks. */
function buildPlan() {
  const raceDay = parseISO(S.goal.raceDate);
  const raceMonday = mondayOf(raceDay);
  const thisMonday = mondayOf(new Date());
  const totalWeeks = Math.max(1, Math.round((raceMonday - thisMonday) / (7 * dayMs)) + 1);
  const p = S.plan;
  const gp = goalPaceSec();

  // marathon block = 14 weeks (his 12-16 band); everything before it is Foundation
  const TAPER = 3, SPEC = 5, BUILD = 5;
  const blockWeeks = Math.min(BUILD + SPEC + TAPER + 1, totalWeeks); // +1 race week
  const foundationWeeks = Math.max(0, totalWeeks - blockWeeks);

  const recent = weeklyAgg(3);
  const startKm = Math.max(p.currentWeeklyKm, recent.reduce((s, w) => s + w.km, 0) / 3);
  const foundationTopKm = Math.min(p.peakWeeklyKm - 8, Math.max(startKm + 14, 50));

  const weeks = [];
  for (let i = 0; i < totalWeeks; i++) {
    const start = new Date(thisMonday.getTime() + i * 7 * dayMs);
    const weeksToGo = totalWeeks - 1 - i;
    const isRace = i === totalWeeks - 1;
    let phase, km, flags = {};

    if (isRace) {
      phase = "Race week"; km = Math.round(p.peakWeeklyKm * 0.3);
    } else if (weeksToGo <= TAPER) {
      phase = "Taper"; km = Math.round(p.peakWeeklyKm * [0.35, 0.5, 0.7][weeksToGo - 1]);
    } else if (weeksToGo <= TAPER + SPEC) {
      phase = "Specific";
      km = Math.round(p.peakWeeklyKm * ((i + 1) % p.cutbackEvery === 0 ? 0.72 : 1));
      const specIdx = TAPER + SPEC - weeksToGo; // 0..4
      flags.specIdx = specIdx;
      flags.ugly = specIdx === 1 || specIdx === 3; // 2 ugly-zone Sundays + their Thu sessions
    } else if (weeksToGo <= TAPER + SPEC + BUILD) {
      phase = "Build";
      const bIdx = TAPER + SPEC + BUILD - weeksToGo; // 0..4
      flags.buildIdx = bIdx;
      km = Math.round(foundationTopKm + (p.peakWeeklyKm - foundationTopKm) * (bIdx / (BUILD - 1)));
      if ((i + 1) % p.cutbackEvery === 0) km = Math.round(km * 0.72);
      flags.test = bIdx === BUILD - 1; // last Build week ends with the test race
    } else {
      phase = "Foundation";
      const frac = foundationWeeks <= 1 ? 1 : i / (foundationWeeks - 1);
      km = Math.round(startKm + (foundationTopKm - startKm) * Math.pow(frac, 0.85));
      if ((i + 1) % p.cutbackEvery === 0) km = Math.round(km * 0.7);
      flags.vo2Week = i % 2 === 1;          // VO2 injection every ~2nd week (7-14 days)
      flags.tt5k = i > 0 && i % 6 === 0;    // 5K time trial every ~6 weeks
    }

    const longKm = isRace ? S.goal.distanceKm
      : Math.round(clamp(km * 0.48, 12, p.longRunPeakKm) * (phase === "Taper" ? 0.7 : 1));
    const runsN = 4;
    const easyEach = Math.max(4, Math.round((km - longKm) / 3));

    // Plan-tab summary lines
    const sessions = [];
    if (isRace) {
      sessions.push({ key: true, txt: `RACE DAY — ${S.goal.raceName}: ${S.goal.targetTime} target (${fmtPace(gp)}), bank ${S.goal.bankTime}` });
    } else if (phase === "Taper") {
      sessions.push({ key: true, txt: `MP touch mid-week, everything else short + easy — save the big day` });
    } else if (phase === "Specific") {
      sessions.push({ key: true, txt: `${flags.ugly ? "UGLY-ZONE week: " : ""}Alternating tempo Tue · big MP session Thu · long run with race-pace work Sun` });
      sessions.push({ txt: `Target: ≥10 km at race pace (${fmtPace(gp + 12)}–${fmtPace(gp - 8)}) across the week` });
    } else if (phase === "Build") {
      sessions.push({ key: true, txt: flags.test ? `TEST WEEK — race a half marathon (or 15k @ MP) on Sunday; it decides the Specific phase` : `Threshold + finisher Tue · steady Thu · solid long run Sun (${longKm} km)` });
    } else {
      sessions.push({ key: true, txt: flags.tt5k ? `5K TIME TRIAL week — recalibrates every zone` : (flags.vo2Week ? `VO2 injection Tue (every ~10 days)` : `Threshold foundations Tue`) + ` · steady Thu · volume long run Sun` });
    }
    weeks.push({ idx: i + 1, start, phase, km, longKm, runsN, easyEach, sessions, isRace, flags, current: i === 0, weeksToGo });
  }
  return weeks;
}

/* ---------- daily calendar (Garmin-coach-style detail) ---------- */
const GYM_TEMPLATES = {
  "Legs": ["Squats 4×8 (or goblet squats)", "Romanian deadlift 3×10", "Walking lunges 3×12/leg", "Calf raises 3×15", "Single-leg glute bridge 3×10/leg", "Plank 3×45s"],
  "Back": ["Pull-ups or lat pulldown 4×8", "Barbell/dumbbell row 4×10", "Face pulls 3×15", "Reverse fly 3×12", "Farmer's carry 3×40m", "Side plank 3×30s/side"],
  "Chest": ["Bench press 4×8", "Incline dumbbell press 3×10", "Push-ups 3×max", "Overhead press 3×10", "Dips (assisted ok) 3×8", "Hollow hold 3×30s"],
};
const pz = (i) => S.paceZones[i];
const paceRange = (i) => `${fmtPace(pz(i).maxSecPerKm)}–${fmtPace(pz(i).minSecPerKm)}`;
const hrRange = (i) => `${S.hrZones[i].minHr}–${S.hrZones[i].maxHr} bpm`;

/* Build the 7 concrete days of a plan week — sessions per The Coach's method. */
function buildWeekDays(w) {
  const gp = goalPaceSec();
  const days = [];
  const runDays = (S.schedule?.runDays ?? [1, 2, 4, 0]).slice();
  const gymDays = S.schedule?.gymDays ?? { "3": "Legs", "5": "Back", "6": "Chest" };
  const longDay = S.schedule?.longRunDay ?? 0;
  const easyEach = w.easyEach ?? Math.max(4, Math.round((w.km - w.longKm) / 3));
  const F = w.flags || {};
  const FUEL = "Fuel: nibble ~10g carbs every 10 min, starting 10 min before";
  const ACT = "Before: 5-min activation (calf raises, lunges, leg swings)";
  const mpBand = `${fmtPace(gp + 10)}–${fmtPace(gp - 5)}`;

  for (let d = 1; d <= 7; d++) {
    const dow = d % 7;
    const date = new Date(w.start.getTime() + (d - 1) * dayMs);
    const day = { date, dow, kind: "rest", arch: "rest", title: "Rest", steps: [], tag: "" };

    if (w.isRace && dow === longDay) {
      day.kind = "race"; day.arch = "race"; day.title = `RACE — ${S.goal.raceName}`; day.tag = "42.2 km";
      day.steps = [
        "Breakfast 2h before; nibble carbs from 10 min before the gun — never slam a gel",
        `0–30 km: lock ${fmtPace(gp)} — never faster ("it's just another Sunday")`,
        "Carbs every 30–40 min like every long run since autumn",
        `30–42 km: the part you rehearsed in the ugly-zone days`,
        `Target ${S.goal.targetTime} · bank ${S.goal.bankTime} · floor sub-4`];
    } else if (runDays.includes(dow) && !w.isRace) {
      day.kind = "run";
      if (dow === longDay) {
        // ---- Sunday: the four long-run types ----
        if (w.phase === "Foundation") {
          day.arch = "long"; day.title = "Long run — volume builder"; day.tag = `${w.longKm} km`;
          day.steps = [ACT,
            `${w.longKm} km @ ${paceRange(1)} (Z2, ${hrRange(1)}) — just banking time, pace irrelevant`,
            "Type 1 of 4: build the distance first; nothing sexy",
            FUEL + " (practice starts NOW, not in the marathon block)"];
        } else if (w.phase === "Build") {
          if (F.test) {
            day.arch = "race"; day.title = "TEST — half marathon race"; day.tag = "21.1 km";
            day.steps = ["The Build phase exam: race a half (or 15 km solo @ MP effort)",
              `Sub-3:30 shape ≈ 1:38–1:41 half · sub-3:45 ≈ 1:45–1:48`,
              "Result recalibrates every zone + decides the Specific phase focus",
              "Full fueling rehearsal: breakfast 2h before, nibble strategy, race shoes"];
          } else {
            day.arch = "long"; day.title = "Long run — solid day"; day.tag = `${w.longKm} km`;
            day.steps = [ACT + " + prepare drinks like race morning",
              `${w.longKm} km @ MP + 15–20s (${fmtPace(gp + 20)}–${fmtPace(gp + 12)}) — a solid day, race intent`,
              "Imperfect route (hills, corners), NOT super shoes — 'why should this day be easy?'",
              FUEL + ", target 50–60g/h"];
          }
        } else if (w.phase === "Specific") {
          if (F.specIdx % 2 === 0) {
            day.arch = "long"; day.title = "Long run — progressive"; day.tag = `${w.longKm} km`;
            day.steps = [ACT,
              `Start @ MP + 1:15/km, step down every 5 km`,
              `Final 4–5 km AT race pace ${fmtPace(gp)}${F.ugly ? " — UGLY ZONE: keep going 2 km past where you want to stop" : ""}`,
              "Don't stare at the watch mid-run — check each 2 km, feel the rest",
              FUEL + ", target 60–80g/h (race dress rehearsal)"];
          } else {
            day.arch = "long"; day.title = "Long run — race-pace reps"; day.tag = `${w.longKm} km`;
            day.steps = [ACT,
              `First half steady (${fmtPace(pz(2).maxSecPerKm + 15)})`,
              `Second half: 4×2 km @ ${fmtPace(gp)} with 1 km float${F.ugly ? " — UGLY ZONE week: last rep 3 km" : ""}`,
              "These km count toward the ≥10 km/week at race pace target",
              FUEL + ", target 60–80g/h"];
          }
        } else { // Taper
          day.arch = "long"; day.title = "Long run — taper"; day.tag = `${w.longKm} km`;
          day.steps = [`${w.longKm} km relaxed Z2 — keep the Sunday rhythm, lose the fatigue`,
            "Still practice fueling at race rate", "Legs should feel better every week now"];
        }
      } else if (dow === 2) {
        // ---- Tuesday: quality slot ----
        if (w.phase === "Foundation") {
          if (F.tt5k) {
            day.arch = "vo2"; day.title = "5K TIME TRIAL"; day.tag = "≈9 km";
            day.steps = ["Warm-up: 15 min easy + drills + 4 strides",
              "5 km all-out, solo, honest — 'after this, no rep can hurt you'",
              "Recalibrates every zone; log the result", "Cool-down 10 min"];
          } else if (F.vo2Week) {
            day.arch = "vo2"; day.title = "VO2 injection"; day.tag = `≈${easyEach + 4} km`;
            day.steps = [ACT, "Warm-up 15 min + strides",
              `Pick one: 5×3 min @ ${paceRange(4)} / 10×400m / 10×60s uphill — vary it`,
              "Inject the meat, then settle back into base for ~10 days", "Cool-down 10 min"];
          } else {
            day.arch = "threshold"; day.title = "Threshold foundations"; day.tag = `≈${easyEach + 4} km`;
            day.steps = [ACT, "Warm-up 15 min + strides",
              `3×10 min @ bottom of threshold ${fmtPace(pz(3).maxSecPerKm)}, 2 min jog`,
              "3–4 word conversation test — if you can't, you're over threshold",
              "Cool-down 10 min"];
          }
        } else if (w.phase === "Build") {
          day.arch = "threshold"; day.title = "Threshold + secret finisher"; day.tag = `≈${easyEach + 5} km`;
          day.steps = [ACT, "Warm-up 15 min + drills + strides",
            `Main: 3×8 min @ ${paceRange(3)} (or 4 mile tempo) — make rep 3 the EASIEST: drop shoulders, long exhales`,
            "Finisher (after 2–3 min): 15s hard / 15s stand, for 5 min — keeps speed alive",
            FUEL, "Cool-down 10 min"];
        } else if (w.phase === "Specific") {
          day.arch = "alt"; day.title = "Alternating tempo"; day.tag = `${10 + Math.min(F.specIdx * 2, 6)} km`;
          day.steps = [ACT, "Warm-up 2 km",
            `${5 + Math.min(F.specIdx, 3)}× [1 km @ threshold ${paceRange(3)} → 1 km float @ ${fmtPace(gp + 12)}]`,
            "The float IS the session — never jog it",
            "If sessions start feeling too good: slow the early reps, save it for race day",
            FUEL, "Cool-down 1 km"];
        } else {
          day.arch = "mp"; day.title = "Marathon-pace touch"; day.tag = "≈6 km";
          day.steps = ["Warm-up 10 min", `3 km @ ${fmtPace(gp)} — should feel boring by now`, "Cool-down 10 min"];
        }
      } else if (dow === 4) {
        // ---- Thursday ----
        if (w.phase === "Specific") {
          const bigs = ["4×3 km", "4×3 km", "3×4 km", "4×4 km", "3×5 km"];
          day.arch = "mp"; day.title = F.ugly ? "Big MP session — UGLY ZONE" : "Big MP session"; day.tag = `≈${w.km - w.longKm - 2 * easyEach + 4} km`;
          day.steps = [ACT, "Warm-up 2 km + strides",
            `${bigs[F.specIdx] || "4×3 km"} @ marathon effort ${mpBand}, 2 min jog between`,
            F.ugly ? "This one should reach the place where you want to stop — that's the training" : "Controlled discomfort, not racing — HR guide only for the first half",
            "Counts toward ≥10 km/week at race pace", FUEL, "Cool-down 1 km"];
        } else if (w.phase === "Taper") {
          day.arch = "easy"; day.title = "Short easy run"; day.tag = `${Math.max(4, easyEach - 2)} km`;
          day.steps = ["Easy Z2, nothing more — freshness is the goal now"];
        } else {
          day.arch = "steady"; day.title = "Steady aerobic"; day.tag = `${easyEach + 2} km`;
          day.steps = [ACT,
            `Main: ${easyEach} km steady @ ${fmtPace(pz(2).maxSecPerKm + 15)}–${fmtPace(pz(2).maxSecPerKm - 5)} (or 2×20 min, 5 min easy between)`,
            "Coach's mindset: 'today I work' — no stops, hold the pace",
            "3–4 word conversation test; watch HR drift (>10 beats at fixed pace = start easier)"];
        }
      } else {
        day.arch = "easy"; day.title = "Easy run"; day.tag = `${easyEach} km`;
        day.steps = [ACT,
          `${easyEach} km @ ${paceRange(1)} (Z2, ${hrRange(1)})`,
          "Luxury run: conversational, zero pressure — if in doubt, slower",
          "Finish with 6×20s strides, full recovery walks"];
      }
    } else if (gymDays[String(dow)]) {
      const g = gymDays[String(dow)];
      if ((w.isRace || w.phase === "Taper") && (dow === 5 || dow === 6) && w.weeksToGo <= 1) {
        day.kind = "rest"; day.arch = "rest"; day.title = "Rest (race week)"; day.steps = ["Legs up, hydrate, carbs, prepare kit"];
      } else {
        day.kind = "gym"; day.arch = "gym"; day.title = `Gym — ${g}`; day.tag = "45–60 min";
        day.steps = (GYM_TEMPLATES[g] || []).slice();
        day.steps.push("Finisher (boring basics): calf raises + adductor squeezes + clams + hip control");
        day.steps.push("Post-gym: protein within 20 min");
        if (w.phase === "Taper") { day.steps = day.steps.slice(0, 3); day.steps.push("Taper: light weights, stop 2 reps short"); }
      }
    }
    days.push(day);
  }
  return days;
}

/* ---------- day explanations (what/why/how, shown in the modal) ---------- */
const EXPLAIN = {
  easy: {
    why: "Volume is the engine of marathon fitness, and easy running is how you buy volume without breaking. It builds capillaries, tendon resilience and fat-burning while letting yesterday's work sink in.",
    how: ["Truly conversational — you could speak full sentences", "HR stays in Z2; walk breaks are fine on hills", "Strides (when listed): 20s fast but relaxed, never sprinting, full recovery"],
    mistakes: ["Running easy days 20-30s/km too fast — the #1 amateur mistake and the one your own data shows", "Chasing pace because the watch says so", "Skipping it because 'it doesn't count' — it counts most"],
    tags: ["easy"]
  },
  steady: {

/* ---------- checkpoint auto-recalibration ----------
   The Coach's method: zones move at checkpoints (5K TT, test race), not continuously.
   Detects a hard recent effort, derives a new threshold, suggests new zones. */
const ZKEY = "rz_zone_override_v1", DKEY = "rz_ck_dismissed_v1";

function checkpointSuggestion() {
  const now = new Date();
  let best = null;
  for (const r of runs()) {
    if (!r.paceSecPerKm || (now - parseISO(r.date)) > 60 * dayMs) continue;
    const p = sustainedPace(r); // moving pace, or the best >=18-min stretch when lap data exists
    let type = null, tEst = null;
    if (r.distanceKm >= 2.9 && r.distanceKm <= 6.5) { type = "5K-effort"; tEst = p + 13; }
    else if (r.distanceKm >= 8 && r.distanceKm <= 12.5) { type = "10K-effort"; tEst = p + 6; }
    else if (r.distanceKm >= 19 && r.distanceKm <= 22.5) { type = "half-marathon"; tEst = p; }
    if (!type) continue;
    const hard = (r.avgHr && r.avgHr >= S.hrZones[3].minHr - 2) || p <= pz(3).maxSecPerKm + 8;
    if (!hard) continue;
    if (!best || tEst < best.tEst) best = { run: r, type, tEst };
  }
  if (!best) return null;
  const curMid = (pz(3).minSecPerKm + pz(3).maxSecPerKm) / 2;
  const diff = Math.round(curMid - best.tEst); // + = you got faster
  if (Math.abs(diff) < 6) return null;
  const t = Math.round(best.tEst);
  const zones = [
    { zone: "Recovery", minSecPerKm: t + 110, maxSecPerKm: t + 190 },
    { zone: "Easy", minSecPerKm: t + 55, maxSecPerKm: t + 105 },
    { zone: "Steady/MP", minSecPerKm: t + 18, maxSecPerKm: t + 50 },
    { zone: "Threshold", minSecPerKm: t - 10, maxSecPerKm: t + 10 },
    { zone: "VO2 Interval", minSecPerKm: t - 45, maxSecPerKm: t - 25 },
    { zone: "Repetition", minSecPerKm: t - 62, maxSecPerKm: t - 47 }
  ];
  return { ...best, zones, diff, t };
}

function applyZoneOverride(sug) {
  try { localStorage.setItem(ZKEY, JSON.stringify({ base: S.paceZones, zones: sug.zones, runId: sug.run.id, date: sug.run.date })); } catch (e) {}
  S.paceZones = sug.zones;
  renderAll();
}
function loadZoneOverride() {
  try {
    const o = JSON.parse(localStorage.getItem(ZKEY) || "null");
    if (o && JSON.stringify(o.base) === JSON.stringify(S.paceZones)) { S.paceZones = o.zones; return o; }
    if (o) localStorage.removeItem(ZKEY); // settings.json changed in repo -> repo wins
  } catch (e) {}
  return null;
}
function ckBannerHTML() {
  const sug = checkpointSuggestion();
  if (!sug) return "";
  try { if (localStorage.getItem(DKEY) === sug.run.id) return ""; } catch (e) {}
  const faster = sug.diff > 0;
  return `<div id="ckbanner">
    <b>Checkpoint detected:</b> ${sug.run.name} — ${fmtKm(sug.run.distanceKm)} km @ ${fmtPace(sug.run.paceSecPerKm)} (${sug.run.date}), read as a ${sug.type}.
    Suggested new threshold: <b>${fmtPace(sug.t + 10)}–${fmtPace(sug.t - 10)}</b> (${faster ? Math.abs(sug.diff) + "s/km faster" : Math.abs(sug.diff) + "s/km slower"} than current). Applying re-derives every zone and regenerates the whole calendar.
    <div class="row">
      <button class="primary" onclick="window.__ckApply()">Apply on this device</button>
      <button onclick="window.__ckCopy()">Copy zones for settings.json</button>
      <button onclick="window.__ckDismiss()">Dismiss</button>
    </div></div>`;
}
window.__ckApply = () => { const s = checkpointSuggestion(); if (s) applyZoneOverride(s); };
window.__ckCopy = async () => {
  const s = checkpointSuggestion(); if (!s) return;
  try { await navigator.clipboard.writeText('"paceZones": ' + JSON.stringify(s.zones, null, 2)); alert("Copied. Paste into data/settings.json (opens next) and commit - that makes it permanent for all devices."); } catch (e) {}
  window.open("https://github.com/alvarovg4444/runzones/edit/main/data/settings.json", "_blank");
};
window.__ckDismiss = () => { const s = checkpointSuggestion(); if (s) { try { localStorage.setItem(DKEY, s.run.id); } catch (e) {} } renderAll(); };

/* --- weekly volume chart (SVG bars + planned line of sight) --- */
function volumeChartSVG(weeks) {
  const W = 960, H = 240, padL = 44, padR = 12, padT = 16, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const maxKm = Math.max(10, ...weeks.map(w => w.km)) * 1.15;
  const bw = iw / weeks.length;
  const y = (v) => padT + ih - (v / maxKm) * ih;

  let g = "";
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = maxKm / ticks * i, yy = y(v);
    g += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${Math.round(v)}</text>`;
  }
  let bars = "";
  weeks.forEach((w, i) => {
    const x = padL + i * bw + bw * 0.22, wd = bw * 0.56;
    const h = Math.max(w.km > 0 ? 3 : 0, ih * (w.km / maxKm));
    const fill = w.current ? "var(--series-2)" : "var(--series-1)";
    bars += `<path d="M${x},${padT + ih} v${-(h - 4)} q0,-4 4,-4 h${wd - 8} q4,0 4,4 v${h - 4} z"
      fill="${fill}" data-tip="Week of ${w.label}|${fmtKm(w.km)} km · ${w.count} run${w.count === 1 ? "" : "s"} · ${fmtDur(w.time)}" class="hit"/>`;
    if (w.km > 0 && (w.current || w.km === Math.max(...weeks.map(q => q.km))))
      bars += `<text x="${x + wd / 2}" y="${y(w.km) - 6}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${fmtKm(w.km)}</text>`;
    bars += `<text x="${x + wd / 2}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${w.label}</text>`;
  });
  g += `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly running volume, kilometres per week" style="width:100%;height:auto">${g}${bars}</svg>`;
}

        <li><b style="color:var(--text-primary)">80% easy.</b> Most running in Z2 (${S.hrZones[1].minHr}–${S.hrZones[1].maxHr} bpm / ${fmtPace(S.paceZones[1].minSecPerKm)}–${fmtPace(S.paceZones[0].maxSecPerKm)}). Your Warsaw 15 km at HR 156 was a great effort — but that intensity every run blocks volume growth.</li>
        <li><b style="color:var(--text-primary)">Long run is sacred.</b> One per week, building to 30–32 km. Marathon pace segments appear in the Peak phase.</li>
        <li><b style="color:var(--text-primary)">Touch goal pace weekly from Build phase.</b> ${fmtPace(gp)} must feel boring by April.</li>
        <li><b style="color:var(--text-primary)">Test races.</b> A 10K in autumn and a half marathon ~8 weeks out (target ≈ 1:52–1:55) will recalibrate every number here automatically.</li>
      </ul>
      <h2 style="margin-top:18px">Goal splits (even pacing)</h2>
      <table style="max-width:420px;margin-top:8px">
        <thead><tr><th>Km</th><th class="num">Elapsed</th></tr></thead>
        <tbody>${splits.map(([k, t]) => `<tr><td>${k}</td><td class="num">${t}</td></tr>`).join("")}</tbody>
      </table>
    </div>`;
}

let CAL = []; // [{week, days}] for modal lookups

function renderCalendar() {
  const el = $("#tab-calendar");
  const plan = buildPlan();
  CAL = plan.map(w => ({ week: w, days: buildWeekDays(w) }));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const DETAIL_WEEKS = 6; // full detail for the next 6 weeks, compact after

  const dayCard = (day, wi, di, compact) => {
    const isToday = day.date.getTime() === today.getTime();
    const colors = { run: "var(--series-1)", gym: "var(--series-2)", race: "var(--critical)", rest: "var(--baseline)" };
    const badge = { run: "RUN", gym: "GYM", race: "RACE", rest: "REST" }[day.kind];
    return `<div class="daycard${isToday ? " today" : ""}" data-w="${wi}" data-d="${di}" title="Click for full detail">
      <div class="dhead"><span class="dnum">${day.date.getDate()}.${day.date.getMonth() + 1}.</span>
        <span class="dbadge" style="background:${colors[day.kind]}">${badge}</span></div>
      <div class="dtitle">${day.title}${day.tag ? ` <span class="dtag">${day.tag}</span>` : ""}</div>
      ${compact || !day.steps.length ? "" : `<ul class="dsteps">${day.steps.slice(0, 4).map(s => `<li>${s}</li>`).join("")}</ul>`}
    </div>`;
  };

  el.innerHTML = `
    <div class="panel">
      <h2>Training calendar</h2>
      <div class="hint"><b>Click any day</b> for the full workout: why it exists, how to execute it, common mistakes, and what The Coach says about it. Your week: runs Mon · Tue · Thu · Sun (long run), gym Wed (legs) · Fri (back) · Sat (chest) — Wed &amp; Sat are no-run days. Detail for the next ${DETAIL_WEEKS} weeks; later weeks fill in as they approach.</div>
      ${CAL.map((cw, wi) => `
        <div class="calweek${cw.week.current ? " current" : ""}">
          <div class="whead" style="margin-bottom:8px">
            <span><b>Week ${cw.week.idx}</b> · ${cw.week.start.toLocaleDateString("en-GB", { day: "numeric", month: "short" })} <span class="phase">· ${cw.week.phase}</span>${cw.week.current ? ' <span class="chip" style="margin-left:6px">this week</span>' : ""}</span>
            <span style="color:var(--text-secondary);font-size:12.5px">${cw.week.isRace ? "Race week" : `${cw.week.km} km running · long ${cw.week.longKm} km`}</span>
          </div>
          <div class="daygrid${wi < DETAIL_WEEKS ? "" : " compactgrid"}">
            ${cw.days.map((d, di) => dayCard(d, wi, di, wi >= DETAIL_WEEKS)).join("")}
          </div>
        </div>`).join("")}
    </div>`;
  el.addEventListener("click", (e) => {
    const card = e.target.closest(".daycard");
    if (!card) return;
    const cw = CAL[+card.dataset.w];
    openDayModal(cw.days[+card.dataset.d], cw.week);
  });
}

function renderCoach() {
  const el = $("#tab-coach");
  const srcs = Object.fromEntries((KB.sources || []).map(s => [s.id, s]));
  const topics = [...new Set((KB.tips || []).map(t => t.topic))];
  el.innerHTML = `
    <div class="panel">
      <h2>Coach's corner — strategies from The Coach</h2>
      <div class="hint">Distilled from transcripts of ${KB.sources?.length || 0} of his training videos (${KB.extracted}). Not generic advice — his specific system, with how each piece applies to your plan. These same tips appear on matching days in the calendar.</div>
      ${topics.map(topic => `
        <div class="topic-h">${topic}</div>
        ${KB.tips.filter(t => t.topic === topic).map(t => `
          <div class="tipcard">
            <h3>${t.title}</h3>
            <div class="ins">${t.insight}</div>
            <div class="app"><b>For you:</b> ${t.apply}</div>
            <div class="src">Source: <a href="${srcs[t.source]?.url}" target="_blank" rel="noopener" style="color:var(--muted)">${srcs[t.source]?.title || t.source}</a></div>
          </div>`).join("")}`).join("")}
    </div>`;
}

function renderZones() {
  const el = $("#tab-zones");
  el.innerHTML = `
    <div class="panel">
      <h2>Heart-rate zones</h2>
      <div class="hint">Based on max HR ${S.athlete.maxHr} (highest observed). Update maxHr in data/settings.json after any race or hard test.</div>
      <table style="max-width:560px">
        <thead><tr><th>Zone</th><th>Name</th><th class="num">bpm</th><th class="num">% max</th></tr></thead>
        <tbody>${S.hrZones.map(z => `<tr><td><b>${z.zone}</b></td><td>${z.name}</td><td class="num">${z.minHr}–${z.maxHr}</td><td class="num">${Math.round(z.minHr / S.athlete.maxHr * 100)}–${Math.round(z.maxHr / S.athlete.maxHr * 100)}%</td></tr>`).join("")}</tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Pace zones</h2>
      <div class="hint">Calibrated from your recent training (best sustained ~${fmtPace(317)}, long run ${fmtPace(347)}). These tighten automatically in spirit — re-derive after each test race.</div>
      <table style="max-width:560px">
        <thead><tr><th>Zone</th><th class="num">Pace</th></tr></thead>
        <tbody>${S.paceZones.map(z => `<tr><td>${z.zone}</td><td class="num">${fmtPace(z.maxSecPerKm)} – ${fmtPace(z.minSecPerKm)}</td></tr>`).join("")}</tbody>
      </table>
      <div class="note">Goal marathon pace ${fmtPace(goalPaceSec())} sits at the top of Steady/MP — exactly where it should be for a realistic goal.</div>
    </div>`;
}

/* ---------- tooltip ---------- */
function wireTooltip() {
  const tip = $("#tooltip");
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest?.("[data-tip]");
    if (!t) { tip.style.display = "none"; return; }
    const [l1, l2] = t.dataset.tip.split("|");
    tip.innerHTML = `<div class="t1">${l1}</div><div class="t2">${l2 || ""}</div>`;
    tip.style.display = "block";
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px";
    tip.style.top = (e.clientY + 16) + "px";
  });
}

/* ---------- boot ---------- */
async function boot() {
  // hosted mode: live JSON overrides the embedded seed
  try {
    const [s, a] = await Promise.all([
      fetch("data/settings.json").then(r => r.ok ? r.json() : null),
      fetch("data/activities.json").then(r => r.ok ? r.json() : null),
    ]);
    if (s) S = s;
    if (a) DB = a;
    const k = await fetch("data/knowledge.json").then(r => r.ok ? r.json() : null).catch(() => null);
    if (k) KB = k;
  } catch (e) { /* file:// mode — use embedded seed */ }
  loadZoneOverride();
  renderNav();
  renderDashboard();
  renderCalendar();
  renderFitness();
  renderSessions();
  renderPlan();
  renderRace();
  renderCoach();
  renderZones();
  activate("dashboard");
  wireTooltip();
  $("#modalWrap .backdrop").addEventListener("click", closeModal);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
}
boot();
</script>
