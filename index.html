const icon = (k, cls) => `<svg${cls ? ` class="${cls}"` : ""} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k] || ICONS.run}</svg>`;

/* ---- ingredients (Scullion-style ledger) ---- */
const ING = [
  { id: "base",      name: "Easy base",      icon: "heart", color: "var(--blue)",   fresh: 7,  stale: 14, desc: "Easy Z1–Z2 running — the volume everything else stands on." },
  { id: "steady",    name: "Steady / MP",    icon: "waves", color: "var(--green)",  fresh: 10, stale: 21, desc: "Controlled running around LT1 — marathon stamina and fuel economy." },
  { id: "threshold", name: "Threshold",      icon: "bolt",  color: "var(--orange)", fresh: 10, stale: 21, desc: "LT2 work — raises the pace you can hold." },
  { id: "vo2",       name: "VO₂ intervals",  icon: "flame", color: "var(--red)",    fresh: 14, stale: 28, desc: "Hard 3–8 min reps — the top of the aerobic chain." },
  { id: "long",      name: "Long run",       icon: "route", color: "var(--purple)", fresh: 10, stale: 21, desc: "The weekly durability session." },
];
const ING_BY = Object.fromEntries(ING.map(i => [i.id, i]));
const ARCH_ING = { easy: "base", steady: "steady", long: "long", threshold: "threshold", vo2: "vo2", alt: "threshold", mp: "steady", race: "threshold" };

function ingredientOf(r) {
  const hit = plannedFor(r.date); const arch = hit && hit.day && hit.day.arch;
  const n = (r.name || "").toLowerCase();
  if (r.distanceKm >= 13 || /long/.test(n) || arch === "long") return "long";
  if (arch === "threshold" || arch === "alt" || /threshold|tempo|schwelle|cruise/.test(n)) return "threshold";
  if (arch === "vo2" || /interval|vo2|track|hill|\brep/.test(n)) return "vo2";
  if (arch === "race" || /einstufung|\btest\b|race|wettkampf|\b5k\b|\b10k\b/.test(n)) return r.distanceKm >= 8 ? "threshold" : "vo2";
  if (arch === "steady" || arch === "mp" || /steady|marathon|\bmp\b/.test(n)) {
    /* a run called "steady" that was run at easy effort is base volume — judge the effort, not the label */
    const c = coreStats(r);
    const easyEffort = c.hr ? c.hr < S.hrZones[2].minHr - 4 : (c.pace && c.pace > pz(2).maxSecPerKm + 10);
    return easyEffort ? "base" : "steady";
  }
  return "base";
}

/* ---- aerobic efficiency: speed per heartbeat on easy-effort runs ---- */
function efficiencyRuns() {
  const lo = S.hrZones[1].minHr - 4, hi = S.hrZones[1].maxHr + 2;
  return runs().map(r => ({ r, c: coreStats(r) }))
    .filter(({ c }) => c.hr && c.pace && c.distKm >= 4 && c.hr >= lo && c.hr <= hi)
    .map(({ r, c }) => ({ r, hr: c.hr, pace: c.pace, distKm: c.distKm, ef: (1000 / c.pace * 60) / c.hr, date: parseISO(r.date) }));
}
const paceAtHr = (ef, hr) => 60000 / (ef * hr); // sec/km a given EF implies at that HR
function efficiencySeries(rangeWeeks) {
  const all = efficiencyRuns();
  const cutoff = rangeWeeks ? addDays(mondayOf(new Date()), -(rangeWeeks - 1) * 7) : null;
  const sel = cutoff ? all.filter(p => p.date >= cutoff) : all;
  const byWeek = new Map();
  for (const p of sel) {
    const k = localKey(mondayOf(p.date));
    const w = byWeek.get(k) || { start: mondayOf(p.date), efSum: 0, km: 0, n: 0, runs: [] };
    w.efSum += p.ef * p.distKm; w.km += p.distKm; w.n++; w.runs.push(p); byWeek.set(k, w);
  }
  const weeks = [...byWeek.values()].map(w => ({ ...w, ef: w.efSum / w.km })).sort((a, b) => a.start - b.start);
  let slope = null;
  if (weeks.length >= 3) {
    const xs = weeks.map(w => (w.start - weeks[0].start) / (7 * dayMs)), ys = weeks.map(w => w.ef), n = xs.length;
    const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
    let sxy = 0, sxx = 0; for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
    slope = sxx ? sxy / sxx : 0;
  }
  const latest = weeks.at(-1) || null;
  const best = weeks.reduce((b, w) => !b || w.ef > b.ef ? w : b, null);
  const now3 = all.slice(-3), prev = all.filter(p => p.date < addDays(new Date(), -28)).slice(-3); // comparison ignores the chart range
  const wavg = arr => arr.length ? arr.reduce((s, p) => s + p.ef * p.distKm, 0) / arr.reduce((s, p) => s + p.distKm, 0) : null;
  const efNow = wavg(now3), efPrev = wavg(prev);
  return { runs: sel, weeks, latest, best, slope, efNow, efPrev,
           changePct: efNow && efPrev ? (efNow / efPrev - 1) * 100 : null,
           trendPct4w: slope != null && latest ? slope * 4 / latest.ef * 100 : null,
           conf: sel.length >= 8 ? "high" : sel.length >= 4 ? "medium" : "low" };
}

/* ---- 28-day performance profile (recent proof, separate from all-time PBs) ---- */
function profile28() {
  const now = new Date();
  const recent = runs().filter(r => now - parseISO(r.date) <= 28 * dayMs);
  const pbs = bestEffortsAll();
  const age = r => Math.round((now - parseISO(r.date)) / dayMs);
  const items = EFFORT_DISTS.slice(0, 3).map(([label, distM]) => {
    let cur = null;
    for (const r of recent) { const p = bestEffortFor(r, distM); if (p != null && (!cur || p < cur.pace)) cur = { pace: p, run: r }; }
    const pb = pbs.find(e => e.distM === distM);
    return { key: label, label, distM, cur, timeS: cur ? Math.round(cur.pace * distM / 1000) : null,
             pbPace: pb && pb.paceSecPerKm, pbTime: pb && pb.timeS, pbRun: pb && pb.run,
             daysLeft: cur ? Math.max(0, 28 - age(cur.run)) : null };
  });
  let b20 = null, pb20 = null;
  for (const r of recent) if (r.best20minSecPerKm && (!b20 || r.best20minSecPerKm < b20.pace)) b20 = { pace: r.best20minSecPerKm, run: r };
  for (const r of runs()) if (r.best20minSecPerKm && (!pb20 || r.best20minSecPerKm < pb20.pace)) pb20 = { pace: r.best20minSecPerKm, run: r };
  items.push({ key: "20min", label: "20 min", distM: null, cur: b20, timeS: null, pbPace: pb20 && pb20.pace, pbTime: null, pbRun: pb20 && pb20.run,
               daysLeft: b20 ? Math.max(0, 28 - age(b20.run)) : null });
  return items;
}

/* ---- ingredient freshness ledger ---- */
function freshnessLedger() {
  const now = new Date(); now.setHours(12, 0, 0, 0);
  const tagged = runs().map(r => ({ r, ing: ingredientOf(r) }));
  const mon = mondayOf(now), weeks8 = []; for (let i = 7; i >= 0; i--) weeks8.push(addDays(mon, -i * 7));
  const upcoming = [];
  for (const w of buildPlan().slice(0, 4)) for (const d of buildWeekDays(w)) if (d.date > now && d.kind === "run") upcoming.push(d);
  return ING.map(ing => {
    const mine = tagged.filter(t => t.ing === ing.id);
    const last = mine.at(-1);
    const days = last ? Math.round((now - parseISO(last.r.date)) / dayMs) : null;
    const status = days == null ? "missing" : days <= ing.fresh ? "fresh" : days <= ing.stale ? "fading" : "stale";
    const n28 = mine.filter(t => now - parseISO(t.r.date) <= 28 * dayMs).length;
    const strip = weeks8.map(ws => mine.some(t => { const d = parseISO(t.r.date); return d >= ws && d < addDays(ws, 7); }));
    const next = upcoming.find(d => ARCH_ING[d.arch] === ing.id) || null;
    return { ...ing, last: last ? last.r : null, days, status, n28, strip, next };
  });
}
const FRESH_WORD = { fresh: "Fresh", fading: "Fading", stale: "Stale", missing: "Missing" };
const FRESH_PILL = { fresh: "good", fading: "warn", stale: "bad", missing: "" };

/* ---- weekly HR response on easy-effort running ---- */
function hrResponse(nWeeks = 8) {
  const mon = mondayOf(new Date()), weeks = [];
  for (let i = nWeeks - 1; i >= 0; i--) {
    const start = addDays(mon, -i * 7), end = addDays(start, 7);
    const sel = runs().filter(r => { const d = parseISO(r.date); return d >= start && d < end; })
      .map(r => ({ r, c: coreStats(r), ing: ingredientOf(r) }))
      .filter(x => ["base", "steady", "long"].includes(x.ing) && x.c.hr && x.c.pace && x.c.hr <= S.hrZones[2].minHr + 4);
    const km = sel.reduce((s, x) => s + x.c.distKm, 0);
    weeks.push({ start, label: `${start.getDate()}.${start.getMonth() + 1}.`, n: sel.length, km, runs: sel,
                 hr: km ? sel.reduce((s, x) => s + x.c.hr * x.c.distKm, 0) / km : null,
                 pace: km ? sel.reduce((s, x) => s + x.c.pace * x.c.distKm, 0) / km : null, current: i === 0 });
  }
  const have = weeks.filter(w => w.hr);
  const recent = have.slice(-2), prior = have.slice(-6, -2);
  let read = null;
  if (recent.length && prior.length) {
    const avg = (arr, k) => arr.reduce((s, w) => s + w[k], 0) / arr.length;
    const dHr = avg(recent, "hr") - avg(prior, "hr"), dPace = avg(recent, "pace") - avg(prior, "pace");
    const expHr = -dPace / 2.7;            // same efficiency: ~1 bpm per 2.7 s/km in the easy range
    const resid = dHr - expHr;
    read = { dHr, dPace, resid, recentHr: avg(recent, "hr"), recentPace: avg(recent, "pace"), priorHr: avg(prior, "hr"), priorPace: avg(prior, "pace"),
             verdict: resid >= 3 ? "creeping" : resid <= -3 ? "improving" : "stable" };
  }
  return { weeks, read };
}

/* ---- this week: done, planned, projected, vs the same point last week ---- */
function weekProjection() {
  const now = new Date(), mon = mondayOf(now), today = new Date(now); today.setHours(0, 0, 0, 0);
  const dow = (now.getDay() + 6) % 7;
  const thisRuns = runs().filter(r => parseISO(r.date) >= mon);
  const done = thisRuns.reduce((s, r) => s + r.distanceKm, 0);
  const cur = buildPlan()[0], days = cur ? buildWeekDays(cur) : [];
  const archKm = { easy: cur && cur.easyEach || 6, steady: 7, threshold: 9, vo2: 8.5, alt: 10, mp: 10, long: cur && cur.longKm || 14, race: 10 };
  const kmOf = d => { if (d.kind !== "run" && d.arch !== "race") return 0; const m = String(d.tag || "").match(/(\d+(?:\.\d+)?)\s*km/); return m ? parseFloat(m[1]) : (archKm[d.arch] || 6); };
  const todayKey = localKey(today);
  const remaining = days.filter(d => d.kind === "run" && (d.date > today || (d.date.getTime() === today.getTime() && !thisRuns.some(r => r.date === todayKey))))
                        .reduce((s, d) => s + kmOf(d), 0);
  const planned = days.filter(d => d.kind === "run").reduce((s, d) => s + kmOf(d), 0);
  const lastMon = addDays(mon, -7), lastSame = addDays(lastMon, dow + 1);
  const lastRuns = runs().filter(r => { const d = parseISO(r.date); return d >= lastMon && d < mon; });
  const lastAtPoint = lastRuns.filter(r => parseISO(r.date) < lastSame).reduce((s, r) => s + r.distanceKm, 0);
  const lastTotal = lastRuns.reduce((s, r) => s + r.distanceKm, 0);
  const daily = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = localKey(d);
    const pd = days.find(x => x.date.getTime() === d.getTime()) || null;
    daily.push({ date: d, km: thisRuns.filter(r => r.date === k).reduce((s, r) => s + r.distanceKm, 0),
                 planned: pd, plannedKm: pd ? kmOf(pd) : 0, past: d < today, isToday: d.getTime() === today.getTime() });
  }
  return { done, remaining, planned, projected: done + remaining, lastAtPoint, lastTotal, daily, count: thisRuns.length, week: cur || null };
}

/* ---- SVG chart kit (2px lines, hairline grid, ≤24px bars, tooltips via data-tip) ---- */
const svgTag = (W, H, label) => `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}" style="width:100%;height:auto;display:block">`;
const niceTicks = (lo, hi, n = 3) => { const span = hi - lo || 1; const raw = span / n; const p = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw) || raw; const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6)); return out; };

function lineChartSVG(o) {
  /* o: { pts:[{x:Date|number, y, tip, dot}], color, yFmt, invert, W, H, xLabel(pt), baseline:{y,label}, area } */
  const W = o.W || 600, H = o.H || 170, padL = o.padL ?? 46, padR = 14, padT = 14, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB, pts = o.pts;
  if (!pts.length) return `<div class="note">Not enough data yet.</div>`;
  const xs = pts.map(p => +p.x), ys = pts.map(p => p.y).concat(o.baseline ? [o.baseline.y] : []);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) { x0 -= 1; x1 += 1; }
  const pad = (Math.max(...ys) - Math.min(...ys)) * 0.25 || Math.abs(ys[0]) * 0.05 || 1;
  const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const X = v => padL + (v - x0) / (x1 - x0) * iw;
  const Y = v => o.invert ? padT + (v - y0) / (y1 - y0) * ih : padT + ih - (v - y0) / (y1 - y0) * ih;
  let g = "";
  for (const t of niceTicks(y0, y1, 3)) {
    g += `<line x1="${padL}" y1="${Y(t)}" x2="${W - padR}" y2="${Y(t)}" stroke="var(--sep)" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--label2)" style="font-variant-numeric:tabular-nums">${o.yFmt ? o.yFmt(t) : t}</text>`;
  }
  if (o.baseline) g += `<line x1="${padL}" y1="${Y(o.baseline.y)}" x2="${W - padR}" y2="${Y(o.baseline.y)}" stroke="var(--label3)" stroke-width="1.5" stroke-dasharray="4 4"/>` +
    `<text x="${W - padR}" y="${Y(o.baseline.y) - 5}" text-anchor="end" font-size="10.5" fill="var(--label2)">${o.baseline.label}</text>`;
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(+p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  if (o.area) g += `<path d="${path}L${X(+pts.at(-1).x).toFixed(1)},${padT + ih}L${X(+pts[0].x).toFixed(1)},${padT + ih}Z" fill="${o.color}" opacity="0.10"/>`;
  g += `<path d="${path}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    g += `<circle cx="${X(+p.x)}" cy="${Y(p.y)}" r="${last ? 4.5 : 3.2}" fill="${last ? o.color : "var(--card)"}" stroke="${o.color}" stroke-width="2" class="hit" data-tip="${p.tip || ""}"/>`;
    if (o.xLabel && (i === 0 || last || pts.length <= 8 || i % Math.ceil(pts.length / 6) === 0))
      g += `<text x="${X(+p.x)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : last ? "end" : "middle"}" font-size="10.5" fill="var(--label2)">${o.xLabel(p)}</text>`;
  });
  return svgTag(W, H, o.label || "line chart") + g + "</svg>";
}

function barChartSVG(o) {
  /* o: { bars:[{label, v, tip, color, faded}], W, H, yFmt, valueLabels, target:{v,label} } */
  const W = o.W || 600, H = o.H || 170, padL = o.padL ?? 40, padR = 10, padT = 16, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB, bars = o.bars;
  const maxV = Math.max(o.minMax || 1, ...bars.map(b => b.v), o.target ? o.target.v : 0) * 1.12;
  const y = v => padT + ih - v / maxV * ih;
  const slot = iw / bars.length, bw = Math.min(24, slot * 0.6);
  let g = "";
  for (const t of niceTicks(0, maxV, 3)) {
    g += `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="var(--sep)" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--label2)" style="font-variant-numeric:tabular-nums">${o.yFmt ? o.yFmt(t) : t}</text>`;
  }
  if (o.target) g += `<line x1="${padL}" y1="${y(o.target.v)}" x2="${W - padR}" y2="${y(o.target.v)}" stroke="var(--label3)" stroke-width="1.5" stroke-dasharray="4 4"/>` +
    `<text x="${padL + 4}" y="${y(o.target.v) - 5}" text-anchor="start" font-size="10.5" fill="var(--label2)">${o.target.label}</text>`;
  bars.forEach((b, i) => {
    const cx = padL + slot * i + slot / 2, h = Math.max(b.v > 0 ? 3 : 0, ih * b.v / maxV), r = Math.min(5, bw / 2);
    if (h > 0) g += `<path d="M${(cx - bw / 2).toFixed(1)},${padT + ih} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${b.color || "var(--blue)"}"${b.faded ? ' fill-opacity="0.45"' : ""} class="hit" data-tip="${b.tip || ""}"/>`;
    else g += `<rect x="${cx - bw / 2}" y="${padT}" width="${bw}" height="${ih}" fill="transparent" class="hit" data-tip="${b.tip || ""}"/>`;
    if (o.valueLabels && b.v > 0 && (b.showValue ?? true)) g += `<text x="${cx}" y="${y(b.v) - 5}" text-anchor="middle" font-size="10.5" fill="var(--label2)" style="font-variant-numeric:tabular-nums">${o.valueLabels(b.v)}</text>`;
    const every = slot >= 38 ? 1 : slot >= 20 ? 2 : 3;
    if (b.label != null && (i % every === (bars.length - 1) % every)) g += `<text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="${b.faded ? "var(--label)" : "var(--label2)"}"${b.faded ? ' font-weight="600"' : ""}>${b.label}</text>`;
  });
  g += `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>`;
  return svgTag(W, H, o.label || "bar chart") + g + "</svg>";
}

function sparkSVG(vals, color, W = 120, H = 34) {
  const v = vals.filter(x => x != null); if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), sp = hi - lo || 1;
  const X = i => 3 + i / (v.length - 1) * (W - 6), Y = x => 4 + (1 - (x - lo) / sp) * (H - 8);
  const d = v.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;display:block" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(v.length - 1)}" cy="${Y(v.at(-1))}" r="3" fill="${color}"/></svg>`;
}

function ringSVG(pct, color, size = 64, stroke = 8, text) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = clamp(pct, 0, 100) / 100;
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:0 0 auto" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dasharray .6s ease"/>
    ${text != null ? `<text x="50%" y="50%" dy="0.36em" text-anchor="middle" font-size="${size * 0.28}" font-weight="700" fill="var(--label)">${text}</text>` : ""}
  </svg>`;
}

    if (pl > 0) { const h = ih * pl / maxKm; g += `<rect x="${cx - 11}" y="${base - h}" width="22" height="${h}" rx="5" fill="var(--fill)" class="hit" data-tip="${d.planned.title}|planned ≈ ${pl} km"/>`; }
    if (d.km > 0) { const h = Math.max(4, ih * d.km / maxKm); g += `<rect x="${cx - 11}" y="${base - h}" width="22" height="${h}" rx="5" fill="var(--blue)" class="hit" data-tip="${fmtDate(d.date, { weekday: "long" })}|${fmtKm(d.km)} km run"/>`; }
    if (kind === "gym") g += `<circle cx="${cx}" cy="${base - 6}" r="4" fill="var(--orange)" class="hit" data-tip="${d.planned.title}|gym day"/>`;
    if (kind === "race") g += `<path d="M${cx},${base - 12} l5,5 -5,5 -5,-5z" fill="var(--red)"/>`;
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11" font-weight="${d.isToday ? 700 : 500}" fill="${d.isToday ? "var(--blue)" : "var(--label2)"}">${dn}</text>`;
    if (d.isToday) g += `<circle cx="${cx}" cy="${H - 20}" r="1.8" fill="var(--blue)"/>`;
  });
  g += `<line x1="0" y1="52.5" x2="${W}" y2="52.5" stroke="var(--sep)"/>`;
  return svgTag(W, H, "This week, day by day") + g + "</svg>";
}

function raceCurveSVG() {
  const rc = riegelCurve();
  if (!rc) return "";
  const gp = goalPaceSec();
  const DISTS = [1000, 1500, 2000, 3000, 5000, 8000, 10000, 15000, 21097.5, 30000, 42195];
  const pts = DISTS.map(D => { const t = rc.predT(D); return { D, t, p: t / (D / 1000), band: rc.bandPct(D) }; });
  const goal = { t: gp * S.goal.distanceKm, p: gp };

  const W = 960, H = 320, padL = 52, padR = 16, padT = 18, padB = 34;
  const iw = W - padL - padR, ih = H - padT - padB;
  const tmin = 150, tmax = Math.max(pts.at(-1).t, goal.t) * 1.12;
  // duration decreases left → right (like the report): longest efforts on the left
  const x = (t) => padL + iw * (1 - (Math.log(t) - Math.log(tmin)) / (Math.log(tmax) - Math.log(tmin)));
  const allP = pts.flatMap(q => [q.p * (1 - q.band / 100), q.p * (1 + q.band / 100)]).concat(rc.anchors.map(a => a.paceSecPerKm), [goal.p]);
  const pLo = Math.min(...allP) - 12, pHi = Math.max(...allP) + 12;
  const y = (p) => padT + (p - pLo) / (pHi - pLo) * ih; // faster pace at the top

  let g = "";
  for (let p = Math.ceil(pLo / 30) * 30; p <= pHi; p += 30) {
    g += `<line x1="${padL}" y1="${y(p)}" x2="${W - padR}" y2="${y(p)}" stroke="var(--grid)"/>`;
    g += `<text x="${padL - 8}" y="${y(p) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmtPace(p).replace("/km", "")}</text>`;
  }
  const TICKS = [[14400, "4h"], [10800, "3h"], [7200, "2h"], [5400, "90m"], [3600, "60m"], [2700, "45m"], [1800, "30m"], [1200, "20m"], [720, "12m"], [300, "5m"], [180, "3m"]];
  for (const [t, lbl] of TICKS) { if (t > tmax || t < tmin) continue;
    g += `<text x="${x(t)}" y="${H - 12}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${lbl}</text>`; }

  const band = pts.map(q => `${x(q.t)},${y(q.p * (1 - q.band / 100))}`).join(" ") + " " +
               pts.slice().reverse().map(q => `${x(q.t)},${y(q.p * (1 + q.band / 100))}`).join(" ");
  const line = pts.map((q, i) => `${i ? "L" : "M"}${x(q.t)},${y(q.p)}`).join("");
  let marks = "";
  for (const q of pts.filter(q => [5000, 10000, 21097.5, 42195].includes(q.D)))
    marks += `<circle cx="${x(q.t)}" cy="${y(q.p)}" r="4" fill="var(--surface-1)" stroke="var(--series-2)" stroke-width="2" class="hit" data-tip="${q.D === 42195 ? "Marathon" : q.D === 21097.5 ? "Half" : fmtKm(q.D / 1000) + " km"} estimate|${fmtTime(Math.round(q.t))} · ${fmtPace(q.p)} · ±${q.band}%"/>`;
  for (const a of rc.anchors)
    marks += `<circle cx="${x(a.timeS)}" cy="${y(a.paceSecPerKm)}" r="4.5" fill="var(--series-1)" class="hit" data-tip="Proven: best ${a.label}|${fmtEffort(a.timeS)} · ${fmtPace(a.paceSecPerKm)} · ${a.run.date}"/>`;
  marks += `<path d="M${x(goal.t)},${y(goal.p) - 6} l6,6 l-6,6 l-6,-6 z" fill="var(--series-3)" class="hit" data-tip="Goal: ${S.goal.targetTime} marathon|${fmtPace(goal.p)} — where the training is taking you"/>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated pace across race durations" style="width:100%;height:auto">
    ${g}<polygon points="${band}" fill="var(--series-2)" opacity="0.13"/>
    <path d="${line}" fill="none" stroke="var(--series-2)" stroke-width="2.5"/>${marks}
    <text x="${padL + iw / 2}" y="${H - 1}" text-anchor="middle" font-size="10.5" fill="var(--muted)">duration · longer ← → shorter</text></svg>
  <div class="legend"><span><i style="background:var(--series-2)"></i>Pace estimate ±band</span><span><i style="background:var(--series-1)"></i>Proven best efforts</span><span><i style="background:var(--series-3)"></i>Goal marathon</span></div>`;
}

      <ul style="margin:10px 0 0 18px;font-size:13.5px;color:var(--text-secondary);display:grid;gap:6px">
        <li><b style="color:var(--text-primary)">How much water per hour:</b> sweat rates vary hugely (0.5–1.5+ L/h), so the honest answer is thirst-led with guardrails — total fluid ≈ 400–800 ml/h (Maurten bottles count toward it): lower end in cool weather, upper end in heat. Under ~75 min you barely need any. Never force drinking to hit a number — on 3 h+ efforts, OVER-drinking plain water is the dangerous direction (hyponatremia), not slight under-drinking. Personalize with the sweat test: weigh naked before/after a 1 h run; each kg lost ≈ 1 L/h sweat rate.</li>
        <li><b style="color:var(--text-primary)">Salt in the water — real physiological job:</b> replaces the sodium leaving in sweat, keeps blood sodium stable when you drink a lot (the anti-hyponatremia margin), helps the gut absorb and the body retain the fluid, and maintains a normal thirst signal. Starting dose: a pinch ≈ 0.5 g salt (~200 mg sodium) per 500 ml on runs over ~2 h; visible salt crust on cap/skin = heavy salty sweater = lean higher. Salt alone doesn't hydrate — it makes the water you drink work better. Fine-tune only after the sweat-rate test; NEVER in the Maurten bottle.</li>
        <li><b style="color:var(--text-primary)">Lemon in the water — taste, nothing more:</b> a squeeze adds ~1 g carbs, no electrolytes, no performance effect. Its real value is palatability: flavoured water gets drunk, plain water gets forgotten — and the sour cuts through the sweetness fatigue of carb fuel late in long runs. Harmless and useful if it makes you drink; just keep it out of the Maurten bottle like everything else.</li>
      </ul>
    </div>

    <div class="panel">
      <h2>Principles</h2>
      <ol style="margin:10px 0 0 18px;font-size:13.5px;color:var(--text-secondary);display:grid;gap:6px">
        <li>Same totals as always: ~92 g/h in-race, 345 g total, Drink Mix 320 + Gel 160 + Gel 100 — no product changes.</li>
        <li>Nibble every gel in 3–4 small bites over ~2–3 minutes — never swallow a whole gel in one go, race day or training.</li>
        <li>Fuel the training week: post-session refuel within 20 minutes is non-negotiable; carb-forward meal the evening before any hard session two days out.</li>
        <li>Pre-session/pre-race eating has a dead zone: real meal ~2 h before, or nothing + nibble from −10 min. Avoid the 20 min–2 h middle ground.</li>
        <li>No flavoured electrolyte tablets in the 2 h pre-run window — plain water (+ a pinch of salt if needed) only, before the gun.</li>
        <li>Confirm Stage 4 (90 g/h) comfort in a real 2h+ rehearsal before race week; the Gel 160 → Gel 100 swap at KM 26/34 is the built-in fallback to ~75–80 g/h.</li>
        <li>If Bottle #2 goes missing: gels + course water/Powerade, same nibble technique, same targets.</li>
        <li>Re-check the final 2027 VCM aid-station positions before race week.</li>
      </ol>
      ${fuelSrc ? `<div class="note" style="margin-top:14px">Source: <a href="${fuelSrc.url}" target="_blank" rel="noopener" style="color:var(--muted)">${fuelSrc.title}</a> — Stephen Scullion, read via transcript. Race: Vienna City Marathon, ${S.goal.raceDate || "18 Apr 2027"}.</div>` : ""}
    </div>`;
}

let CAL = []; // [{week, days}] for modal lookups

function renderCalendar() {
  const el = $("#tab-calendar");
  const plan = buildPlan();
  CAL = plan.map(w => ({ week: w, days: buildWeekDays(w) }));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const DETAIL_WEEKS = 2; // full detail for this week and next, compact after (tap any day for everything)

  const dayCard = (day, wi, di, compact, past) => {
    const isToday = day.date.getTime() === today.getTime();
    const colors = { run: "var(--blue)", gym: "var(--orange)", race: "var(--red)", rest: "var(--gray)" };
    const badge = { run: "RUN", gym: "GYM", race: "RACE", rest: "REST" }[day.kind];
    return `<div class="daycard${isToday ? " today" : ""}${past ? " pastday" : ""}" data-w="${wi}" data-d="${di}" title="Click for full detail">
      <div class="dhead"><span class="dnum">${day.date.getDate()}.${day.date.getMonth() + 1}.</span>
        <span class="dbadge" style="background:${colors[day.kind]}">${badge}</span></div>
      <div class="dtitle">${day.title}${day.tag ? ` <span class="dtag">${day.tag}</span>` : ""}</div>
      ${compact || past || !day.steps.length ? "" : `<ul class="dsteps">${day.steps.slice(0, 4).map(s => `<li>${s}</li>`).join("")}</ul>`}
    </div>`;
  };

  // pinned "today" card so the day's session is always first — no scrolling
  let todayHTML = "";
  outer: for (let wi = 0; wi < CAL.length; wi++) {
    const days = CAL[wi].days;
    for (let di = 0; di < days.length; di++) {
      if (days[di].date.getTime() === today.getTime()) {
        todayHTML = `<div class="panel" id="todaypanel">
          <h2>Today — ${days[di].title}</h2>
          <div class="hint">${today.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })} · Week ${CAL[wi].week.idx} · ${CAL[wi].week.phase} phase · click the card for the full briefing</div>
          <div class="daygrid" style="grid-template-columns:minmax(0,1fr)">${dayCard(days[di], wi, di, false, false)}</div>
        </div>`;
        break outer;
      }
    }
  }

  el.innerHTML = `
    ${todayHTML}
    <div class="panel">
      <h2>Training calendar</h2>
      <div class="hint"><b>Click any day</b> for the full workout: why it exists, how to execute it, common mistakes, and what The Coach says about it. Your week: runs Mon · Tue · Thu · Sun (long run), gym Wed (legs) · Fri (back) · Sat (chest) — Wed &amp; Sat are no-run days. Detail for the next ${DETAIL_WEEKS} weeks; later weeks fill in as they approach.</div>
      ${CAL.map((cw, wi) => `
        <div class="calweek${cw.week.current ? " current" : ""}">
          <div class="whead" style="margin-bottom:8px">
            <span><b>Week ${cw.week.idx}</b> · ${cw.week.start.toLocaleDateString("en-GB", { day: "numeric", month: "short" })} <span class="phase">· ${cw.week.phase}</span>${cw.week.current ? ' <span class="chip" style="margin-left:6px">this week</span>' : ""}</span>
            <span style="color:var(--text-secondary);font-size:12.5px">${cw.week.isRace ? "Race week" : `${cw.week.km} km running · long ${cw.week.longKm} km`}</span>
          </div>
          <div class="daygrid${wi < DETAIL_WEEKS ? "" : " compactgrid"}">
            ${cw.days.map((d, di) => dayCard(d, wi, di, wi >= DETAIL_WEEKS, d.date < today)).join("")}
          </div>
        </div>`).join("")}
    </div>`;
  el.addEventListener("click", (e) => {
    const card = e.target.closest(".daycard");
    if (!card) return;
    const cw = CAL[+card.dataset.w];
    openDayModal(cw.days[+card.dataset.d], cw.week);
  });
}

const ZONE_CARDS = [
  { what: "Your easiest running, with no meaningful extra fatigue.",
    benefit: "Boosts blood flow, eases stiffness and aids recovery.",
    use: "Recovery days, warm-ups and cool-downs.",
    feel: "Very relaxed; full conversation.",
    example: "30–45 min very easy.",
    watch: "do not turn it into another workout because you feel good." },
  { what: "Comfortable running — the foundation of your training.",
    benefit: "Builds endurance and efficiency without heavy fatigue.",
    use: "Most daily runs and most of your long-run volume (~80% of everything).",
    feel: "Relaxed, conversational, controlled breathing.",
    example: "60–90 min comfortable — your Sunday long run lives here.",
    watch: "the top pulse is a ceiling, not a target — easy must not become steady." },
  { what: "Controlled aerobic running just below threshold — your first lactate turn-point.",
    benefit: "Builds stamina and fuel economy. The marathon is a fuel race raced at LT1, not LT2.",
    use: "Steady runs and marathon-supporting long-run blocks.",
    feel: "Purposeful but controlled; short sessions only.",

    watch: "it costs more than easy running — do not drift into it every day." },
  { what: "Hard, controlled running near your repeatable limit — the second lactate turn-point.",
    benefit: "Raises sustainable race pace; teaches the body to clear by-products.",
    use: "Tempo runs, cruise intervals, race-specific sessions.",
    feel: "Hard but repeatable; the last rep should feel like the first.",
    example: "3 × 10 min with 2 min easy, or 30 min straight at the bottom end.",
    watch: "pulse rises slowly — do not judge the first rep by pulse or chase a number." },
  { what: "Hard 3–8 min reps above threshold, below a sprint.",
    benefit: "Pulls the whole chain up: VO₂ → aerobic power → LT2 → race pace.",
    use: "Long intervals, hill reps and race sharpening.",
    feel: "Hard breathing, high focus, pace controlled.",
    example: "5 × 3 min with equal easy recovery.",
    watch: "the fastest rep is not the goal — consistent reps create the benefit." },
  { what: "Short, fast reps led by pace, form and duration.",
    benefit: "Develops top-end speed, coordination and running economy.",
    use: "Strides, short hills, track reps.",
    feel: "Very hard but technical; stop before form fails.",
    example: "6–8 × 30 s strides, full recovery.",
    watch: "pulse may never fully respond — never accelerate just to chase heart rate." },

function renderZones() {
  const el = $("#tab-zones");
  const z = S.paceZones, h = S.hrZones;
  const latest = runs().at(-1);
  const best20 = Math.min(...runs().map(r => r.best20minSecPerKm ?? Infinity));
  const spanSlow = z[0].maxSecPerKm + 15, spanFast = z[z.length - 1].minSecPerKm - 15;
  const posPct = (p) => clamp((spanSlow - p) / (spanSlow - spanFast) * 100, 0, 100); // slower ← → faster

  el.innerHTML = `
    <div class="panel" id="ltlookup">
      <h2>Where does a pace put you?</h2>
      <div class="hint">Type any pace — the app tells you which zone it is and where you sit against your two lactate turn-points (LT1 ≈ top of Steady, LT2 ≈ Threshold). Zones are anchored to current fitness and move only when the data says so.</div>
      <div class="inrow">
        <input id="ltpace" inputmode="numeric" placeholder="5:30" aria-label="pace min:sec per km"/><span style="color:var(--muted);font-size:13px">min/km</span>
        ${latest?.paceSecPerKm ? `<button class="preset" data-p="${latest.paceSecPerKm}">Latest run ${fmtPace(latest.paceSecPerKm).replace("/km", "")}</button>` : ""}
        ${isFinite(best20) ? `<button class="preset" data-p="${best20}">Best 20 min ${fmtPace(best20).replace("/km", "")}</button>` : ""}
        <button class="preset" data-p="${goalPaceSec()}">Goal MP ${fmtPace(goalPaceSec()).replace("/km", "")}</button>
      </div>
      <div class="pacebar" aria-hidden="true">
        ${z.map((zz, i) => { const l = posPct(zz.maxSecPerKm), r = posPct(zz.minSecPerKm); return `
          <div class="seg" style="left:${l}%;width:${r - l}%;background:${ZONE_COLORS[i]}"></div>
          <div class="seglbl${i % 2 ? " row2" : ""}" style="left:${l}%">${zz.zone}${ZONE_LT[i].badge ? " · " + ZONE_LT[i].badge : ""}</div>`; }).join("")}
        <div class="marker" id="ltmarker" style="left:50%;display:none"></div>
      </div>
      <div id="ltverdict" style="display:none"></div>
    </div>
    <div class="panel">
      <h2>Your zones, explained</h2>
      <div class="hint">Each zone has a different job — easy builds the base, steady (LT1) builds stamina, threshold (LT2) raises sustainable speed, and fast work develops your top end. Faster is not automatically better. Pulse anchored to max HR ${S.athlete.maxHr}.</div>
      <div class="zgrid">
        ${z.map((zz, i) => { const hz = h[ZONE_HR_MAP[i]]; const c = ZONE_CARDS[i]; return `
          <div class="zcard" id="zcard-${i}" style="--zc:${ZONE_COLORS[i]}">
            <h3>${zz.zone}${ZONE_LT[i].badge ? ` <span class="ltbadge">${ZONE_LT[i].badge}</span>` : ""}</h3>
            <div class="znum">
              <div><div class="k">Pace /km</div><div class="v">${fmtPace(zz.minSecPerKm).replace("/km", "")}–${fmtPace(zz.maxSecPerKm).replace("/km", "")}</div></div>
              <div><div class="k">Pulse</div><div class="v">${i === 5 ? "rises late" : `${hz.minHr}–${hz.maxHr} bpm`}</div></div>
            </div>
            <div class="zrow"><b>What it is</b> · ${c.what}</div>
            <div class="zrow"><b>Benefit</b> · ${c.benefit}</div>
            <div class="zrow"><b>Use it for</b> · ${c.use}</div>
            <div class="zrow"><b>Feel</b> · ${c.feel}</div>
            <div class="zrow"><b>Example</b> · ${c.example}</div>
            <div class="zwatch"><b>Watch out</b> — ${c.watch}</div>
          </div>`; }).join("")}
      </div>
      <div class="note" style="border-left:3px solid var(--series-2);padding:8px 12px;background:var(--chip-bg);border-radius:0 8px 8px 0;margin-top:14px"><b style="color:var(--text-primary)">Why pace changes with duration</b> — a short repetition can be quicker than continuous running in the same zone, and pulse takes time to catch up. Use pace, duration and repeatability first — then use pulse as confirmation.</div>
      <div class="note">${(() => { const g = goalPaceSec(), v = paceToLT(g); return `Goal marathon pace ${fmtPace(g)} currently reads as <b>${v.name}</b> against today's zones. On race day it must sit at the top of Steady/MP (LT1) — the training's whole job is to move these zones until it does. Each recalibration updates this line.`; })()}</div>
    </div>`;

  const input = el.querySelector("#ltpace");
  const update = (p) => {
    const v = paceToLT(p);
    const marker = el.querySelector("#ltmarker"), box = el.querySelector("#ltverdict");
    el.querySelectorAll(".zcard").forEach(c => c.classList.remove("hitzone"));
    if (!v) { marker.style.display = "none"; box.style.display = "none"; return; }
    marker.style.display = "block"; marker.style.left = posPct(p) + "%";
    box.style.display = "block";
    const hz = v.idx >= 0 && v.idx <= 5 ? h[ZONE_HR_MAP[Math.round(v.idx)]] : null;
    box.innerHTML = `<div class="big">${fmtPace(p)} → ${v.name}${v.badge ? ` <span class="ltbadge">${v.badge}</span>` : ""} · ${v.lt}</div>
      <div class="sub">${v.ltDesc}.${hz ? ` Expected pulse once settled: ${hz.minHr}–${hz.maxHr} bpm (${hz.zone}).` : ""}</div>`;
    if (v.idx >= 0 && v.idx <= 5) el.querySelector(`#zcard-${Math.round(v.idx)}`)?.classList.add("hitzone");
  };
  input.addEventListener("input", () => update(parsePace(input.value)));
  el.querySelectorAll(".preset").forEach(b => b.addEventListener("click", () => {
    const p = +b.dataset.p; input.value = fmtPace(p).replace("/km", ""); update(p);
  }));
  if (latest?.paceSecPerKm) { input.value = fmtPace(latest.paceSecPerKm).replace("/km", ""); update(latest.paceSecPerKm); }
}

/* ---------- tooltip ---------- */
function wireTooltip() {
  const tip = $("#tooltip");
  let hideT = null;
  const show = (t, x, y) => {
    const [l1, l2] = t.dataset.tip.split("|");
    tip.innerHTML = `<div class="t1">${l1}</div><div class="t2">${l2 || ""}</div>`;
    tip.style.display = "block";
    tip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = Math.min(y + 16, window.innerHeight - tip.offsetHeight - 8) + "px";
  };
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest?.("[data-tip]");
    if (!t) { if (!hideT) tip.style.display = "none"; return; }
    show(t, e.clientX, e.clientY);
  });
  /* touch: tap a bar or point to see its value for a moment */
  document.addEventListener("touchstart", (e) => {
    const t = e.target.closest?.("[data-tip]"); if (!t) { tip.style.display = "none"; return; }
    const p = e.touches[0]; show(t, p.clientX - 60, p.clientY - 70);
    clearTimeout(hideT); hideT = setTimeout(() => { tip.style.display = "none"; hideT = null; }, 1800);
  }, { passive: true });
}

/* ---------- boot ---------- */
async function boot() {
  // hosted mode: live JSON overrides the embedded seed
  try {
    const [s, a] = await Promise.all([
      fetch("data/settings.json").then(r => r.ok ? r.json() : null),
      fetch("data/activities.json").then(r => r.ok ? r.json() : null),
    ]);
    if (s) S = s;
    if (a) DB = a;
    const k = await fetch("data/knowledge.json").then(r => r.ok ? r.json() : null).catch(() => null);
    if (k) KB = k;
  } catch (e) { /* file:// mode — use embedded seed */ }
  loadZoneOverride();
  renderNav();
  renderDashboard();
  renderCalendar();
  renderFitness();
  renderSessions();
  renderPlan();
  renderRace();
  renderFuel();
  renderCoach();
  renderZones();
  activate((location.hash || "").slice(1) || "dashboard");
  window.addEventListener("hashchange", () => activate((location.hash || "").slice(1) || "dashboard"));
  watchChartWidth();
  wireTooltip();
  $("#modalWrap .backdrop").addEventListener("click", closeModal);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
}
boot();
