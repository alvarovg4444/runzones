name: Intervals.icu sync

on:
  schedule:
    - cron: "41 * * * *"      # every hour at :41
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write
  actions: write              # allows this workflow to trigger the Pages deploy

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull new activities from intervals.icu
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          if [ -z "$INTERVALS_API_KEY" ]; then
            echo "INTERVALS_API_KEY secret not set - skipping."
            exit 0
          fi
          python3 scripts/intervals_sync.py

      - name: Commit if changed
        id: commit
        run: |
          if ! git diff --quiet data/activities.json; then
            git config user.name "intervals-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/activities.json
            git commit -m "Sync activities from intervals.icu"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy site with fresh data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
