name: Garmin CSV import

on:
  push:
    paths:
      - "data/garmin_export.csv"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert and merge Garmin CSV
        run: |
          if [ ! -f data/garmin_export.csv ]; then
            echo "No data/garmin_export.csv found - nothing to import."
            exit 0
          fi
          python3 scripts/import_garmin_csv.py data/garmin_export.csv

      - name: Commit if changed
        run: |
          if ! git diff --quiet data/activities.json; then
            git config user.name "garmin-import-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/activities.json
            git rm -f --ignore-unmatch data/garmin_export.csv
            git commit -m "Import activities from Garmin CSV export"
            git push
          else
            echo "Nothing new in the CSV."
          fi
