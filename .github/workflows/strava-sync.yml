name: Strava sync

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull new Strava activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 scripts/strava_sync.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet data/activities.json; then
            git config user.name "strava-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/activities.json
            git commit -m "Sync Strava activities"
            git push
          else
            echo "Nothing to commit."
          fi
